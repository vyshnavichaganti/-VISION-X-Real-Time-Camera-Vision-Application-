version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vision-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AI Real-Time Camera Vision API
      - VERSION=0.3.0
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost", "http://localhost:5173", "http://localhost:80", "http://127.0.0.1"]
      - MAX_CONCURRENT_INFERENCE=1
      - MAX_PAYLOAD_MB=10.0
      - SESSION_TTL_SECONDS=600
    volumes:
      - vision-model-weights:/app/models
    networks:
      - vision-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vision-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vision-network

networks:
  vision-network:
    driver: bridge

volumes:
  vision-model-weights:
